[project]
name = "mcbp-core"
version = "0.1.2"
description = "Shared async HTTP client + typed errors for BAS MCBP_AI (used by backend and mcp-server)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "MCBP.PLUS" }]
keywords = ["bas", "1c", "erp", "mcbp", "httpx"]
dependencies = [
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://mcbp.plus"
Repository = "https://github.com/kzavrazhnyi/mcbp-mcp-server"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mcbp_core*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
