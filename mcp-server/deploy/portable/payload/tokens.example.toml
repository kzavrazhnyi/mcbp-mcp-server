# Зразок реєстру токенів. Скопіюйте у tokens.toml, замініть значення і вкажіть файл
# у server.env: MCP_TOKENS_FILE=tokens.toml
#
# Кожен запис зіставляє токен клієнта з обліковкою BAS: дії цього клієнта підуть у журнал
# реєстрації бази від імені onec_user. Токен друкує new-token.cmd — по одному на клієнта.
#
# Файл читається ПРИ СТАРТІ сервера: після правки перезапустіть його.
# У ньому паролі — тримайте поза загальним доступом і не кладіть у git.

[[users]]
token = "замініть-на-рядок-з-new-token.cmd"
onec_user = "Директор-Корнієнко"
onec_password = ""
label = "Директор"

[[users]]
token = "замініть-на-інший-рядок"
onec_user = "Комірник-Іванов"
onec_password = "пароль"
label = "Склад"
