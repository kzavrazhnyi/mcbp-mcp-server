# Internal HTTPS through the web server that already publishes the BAS base.
#
# On Linux the 1C/BAS publication usually runs under Apache with its own (often self-signed)
# certificate. Reusing that site gives the MCP endpoint TLS with zero new certificates and no
# new port in the firewall: clients dial https://<server>/mcp, Apache forwards to the instance
# on loopback. The instance must then listen on 127.0.0.1 (install-ubuntu.sh --bind 127.0.0.1).
#
#   sudo a2enmod proxy proxy_http headers
#   # paste the block below INSIDE the existing <VirtualHost *:443> of the publication
#   sudo apachectl configtest && sudo systemctl reload apache2
#
# Check from a VPN machine — a JSON-RPC answer, not an HTML page, means the proxy reaches MCP:
#   curl -k https://<server>/mcp -H 'Authorization: Bearer <token>' \
#     -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' \
#     -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"curl","version":"0"}}}'
#
# The certificate must name the address clients use (subjectAltName IP:<server> or DNS:<name>).
# A certificate with only a CN is rejected by current clients even when it is trusted.
# Each client machine trusts it once: Windows — client-kit/trust-cert.cmd; macOS — Keychain.

<Location "/mcp">
    # One instance per base: a second base gets its own Location (/mcp-demo) and port.
    ProxyPass "http://127.0.0.1:8011/mcp" flushpackets=on timeout=310
    ProxyPassReverse "http://127.0.0.1:8011/mcp"
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    # Streamable HTTP answers over SSE: compression and buffering would hold the stream back
    # until it ends. flushpackets=on above and no-gzip here keep it flowing.
    SetEnv no-gzip 1

    # The Authorization header carries the caller's token and is passed through untouched —
    # do NOT add Apache auth (AuthType/Require) here, it would consume the same header.
</Location>
