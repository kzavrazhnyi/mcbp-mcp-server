# Inside the TLS `server { }` block for mcp.example.com.
# The certificate must be publicly valid: Claude Desktop/web do not connect from the user's
# machine — hosted surfaces are served by Anthropic infrastructure, egress 160.79.104.0/21.

location /mcp {
    proxy_pass http://127.0.0.1:8010;
    proxy_http_version 1.1;

    # Must match MCP_HTTP_ALLOWED_HOSTS, which the SDK checks against the Host header.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Streamable HTTP answers over SSE — buffering swallows the stream until it ends.
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding off;

    # Above the client-side 300 s tool-call limit, so nginx is never the one to cut a call.
    proxy_read_timeout 310s;
    proxy_send_timeout 310s;

    # Stage 1 stands in for authentication. It keeps the open internet out, but NOT other
    # Claude users who learn the URL — that gap closes only with OAuth or a bearer header.
    allow 160.79.104.0/21;
    deny all;
}

location = /healthz {
    proxy_pass http://127.0.0.1:8010/healthz;
    access_log off;
    allow 127.0.0.1;
    deny all;
}
