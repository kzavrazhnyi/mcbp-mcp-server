# NOT USED IN STAGE 1.
#
# Stage 1 (internal network) has no nginx: each instance listens on the LAN itself and clients
# dial its port directly. This file is the stage-2 artifact — the day the endpoint moves to a
# server with a public IP, nginx becomes the single entrance, terminates TLS, and is the only
# place where access control exists.
#
# Goes inside the TLS `server { }` block for the public hostname. Adopting it means, on the
# same day: MCP_HTTP_HOST back to 127.0.0.1 on every instance, and MCP_HTTP_ALLOWED_HOSTS set
# to that hostname.

# --- Access control: pick ONE, none is the default ---
#
# The server itself authenticates nobody: it decides WHAT a caller may do (their own BAS account
# when they send `Authorization: Basic ...`, the service account otherwise), never WHETHER they
# may connect. Whatever stands here is the whole of the latter.
#
# THE `Authorization` HEADER IS TAKEN. Clients use it to carry their BAS credentials, and
# `proxy_pass` forwards it to the instance unchanged — which it must, or every caller silently
# drops back to the service account. So do NOT put `auth_basic` on these locations, and do not
# reuse `$http_authorization` for a gate of your own (see (b)): both consume the same header.
#
# (a) Source-IP allow-list. Only fits when the client is known by address. The Anthropic egress
#     range below fits exactly one case — a HOSTED connector (claude.ai, Claude Desktop),
#     which reaches us from Anthropic infrastructure rather than from the user's machine:
#         allow 160.79.104.0/21;
#         deny all;
#     It does NOT protect against other Claude users who learn the URL. It is also wrong for a
#     client that runs on the user's own machine (Claude Code, or an in-house application),
#     whose address is the office/VPN range instead.
#
# (b) Token per base in a SEPARATE header, checked by nginx, zero code in our server. Grant =
#     hand over the token; revoke = delete the line and `nginx -s reload`.
#         map $http_x_mcbp_token $ok_prod {
#             default 0;
#             "<token-prod>" 1;
#         }
#     Claude Code sends custom headers for HTTP MCP servers, so a second `--header` works there.
#     It must NOT be `Authorization` — that header now carries the caller's BAS credentials.
#
# (c) OAuth. The proper answer for a hosted connector surface; a separate piece of work.

# --- One location per instance ---
#
# The base is chosen by the path; `proxy_pass` supplies the instance's port and rewrites the
# path to the instance's own /mcp, so MCP_HTTP_PATH stays at its default everywhere.
# `location =` is an exact match, which is what the code does too: the app uses Starlette
# `Route`, not `Mount`, so a bare POST to /mcp/prod must match exactly and never redirect.

location = /mcp/prod {
    # if ($ok_prod = 0) { return 403; }     # option (b)
    proxy_pass http://127.0.0.1:8011/mcp;
    proxy_http_version 1.1;

    # Must match MCP_HTTP_ALLOWED_HOSTS, which the SDK checks against the Host header.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Streamable HTTP answers over SSE — buffering swallows the stream until it ends.
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding off;

    # Above the client-side 300 s tool-call limit, so nginx is never the one to cut a call.
    proxy_read_timeout 310s;
    proxy_send_timeout 310s;
}

location = /mcp/demo {
    # if ($ok_demo = 0) { return 403; }
    proxy_pass http://127.0.0.1:8012/mcp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding off;
    proxy_read_timeout 310s;
    proxy_send_timeout 310s;
}

# Liveness of one instance. Local only: it says nothing an outsider needs, and answering it
# publicly only advertises which ports are alive.
location = /healthz/prod {
    proxy_pass http://127.0.0.1:8011/healthz;
    access_log off;
    allow 127.0.0.1;
    deny all;
}
